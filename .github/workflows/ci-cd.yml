name: Candor CI/CD

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: "25"
          distribution: "temurin"
          cache: maven
      - name: Run backend unit tests
        working-directory: backend
        run: mvn -B test

  build-backend:
    needs: test-backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: "25"
          distribution: "temurin"
          cache: maven
      - name: Build backend jar
        working-directory: backend
        run: mvn -B clean package -DskipTests
      - name: Build backend Docker image
        working-directory: backend
        run: docker build -t candor-backend:${{ github.sha }} .

  build-frontend:
    needs: test-backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Build frontend
        working-directory: frontend
        run: npm run build
      - name: Build frontend Docker image
        working-directory: frontend
        run: docker build -t candor-frontend:${{ github.sha }} .

  # Continuous Integration runs automatically on push & pull request:
  # 1. test-backend (JUnit 5 unit tests)
  # 2. build-backend (Spring Boot JAR packaging)
  # 3. build-frontend (Vite TypeScript production build)
