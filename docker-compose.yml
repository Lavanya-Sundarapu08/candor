services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: candor
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - candor-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Single-node Kafka in KRaft mode (broker + controller combined) - no
  # separate Zookeeper container needed. Fine for local dev; a real
  # deployment would use multiple brokers for durability/throughput.
  kafka:
    image: apache/kafka:3.8.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
    ports:
      - "9092:9092"

  backend:
    build:
      context: ./backend
    ports:
      - "8080:8080"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: candor
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      FRONTEND_ORIGIN: http://localhost:3000
      JWT_SECRET: candor-local-dev-secret-change-me-1234567890
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      # Ollama typically runs on your host machine, not in a container.
      # host.docker.internal is Docker Desktop's special DNS name for
      # reaching the host from inside a container - "localhost" here would
      # incorrectly point at the container itself, not your machine.
      OLLAMA_BASE_URL: http://host.docker.internal:11434
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started

  frontend:
    build:
      context: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  candor-postgres-data:
