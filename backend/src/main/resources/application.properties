spring.application.name=candor-backend
server.port=${PORT:8080}

# PostgreSQL, matching the rest of your stack (Java 21 + Spring Boot + PostgreSQL).
# Every value below reads from an environment variable first, falling back to
# the local default - so this same jar runs unchanged locally, in Docker
# Compose (DB_HOST=postgres), and on AWS (DB_HOST=<RDS endpoint>) with no
# code changes and no hardcoded secrets.
# Local setup: create the database first with `CREATE DATABASE candor;`
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:candor}}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:database}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false

# GitHub API base. A personal access token can be supplied per-request in the
# UI instead of here, which keeps the project runnable without any secrets.
github.api.base-url=https://api.github.com

# How many days after a PR is merged we still count a bug-fix commit on the
# same file as "related" to that approval.
candor.follow-up-window-days=${FOLLOW_UP_WINDOW_DAYS:14}

# Allowed CORS origin - the frontend's URL. Overridden in production to the
# CloudFront domain via the FRONTEND_ORIGIN environment variable.
candor.frontend-origin=${FRONTEND_ORIGIN:http://localhost:5173}

# JWT auth. JWT_SECRET below is a DEV-ONLY DEFAULT (never used if the env var
# is set) - always override it with a real secret via the JWT_SECRET
# environment variable in any shared or deployed environment.
jwt.secret=${JWT_SECRET:candor-dev-only-secret-do-not-use-in-production-change-me-1234567890}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Kafka - the async analysis pipeline. Defaults to a local broker; in Docker
# Compose this is overridden to the "kafka" service name.
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=candor-analysis-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.candor.dto
spring.kafka.consumer.properties.spring.json.value.default.type=com.candor.dto.AnalyzeJobRequestedEvent
candor.kafka.analyze-topic=candor-analyze-requests

# Spring AI / Ollama. Requires Ollama running locally (or reachable at
# OLLAMA_BASE_URL) with the configured model pulled, e.g.:
#   ollama pull deepseek-r1
# The AI Interpretation feature degrades to a clear error message, not a
# crash, if Ollama is unreachable.
spring.ai.ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
spring.ai.ollama.chat.model=${OLLAMA_MODEL:deepseek-r1}
spring.ai.ollama.chat.options.temperature=0.2
# Disable Kafka auto-connection when running locally without Docker Kafka

# Disable Kafka auto-connection locally so app boots without Kafka daemon
#spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration
spring.kafka.listener.auto-startup=false

# Do not block startup if Kafka broker is offline
spring.kafka.admin.fail-fast=false
spring.kafka.admin.auto-create=false
